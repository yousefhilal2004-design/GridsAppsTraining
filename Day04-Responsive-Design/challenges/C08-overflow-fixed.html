<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C08 Fixed Overflow</title><style>*,*::before,*::after{box-sizing:border-box}body{font:16px Arial;margin:20px;background:#f3f6fb}.card{width:100%;max-width:900px;padding:clamp(1rem,4vw,2rem);border:3px solid steelblue;background:white;overflow-wrap:anywhere}.wide-image{display:block;width:100%;max-width:100%;height:auto}</style></head><body><h1>C08: Fixed version</h1><p>This version fits on small screens because the card and image have flexible widths.</p><div class="card"><h2>Responsive card</h2><p>box-sizing, max-width and fluid images prevent horizontal overflow.</p><img class="wide-image" src="../images/study-workspace.svg" alt="Computer workstation illustration"></div></body></html>
